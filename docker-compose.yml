services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8001:8001"]
    env_file: .env
    volumes: ["./:/app"]
    command: /app/.venv/bin/python -m uvicorn src.api.routes:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [api]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
